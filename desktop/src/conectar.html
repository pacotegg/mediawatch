<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Media Watch</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #08080b; color: #eee; font: 15px system-ui, sans-serif; }
  form { width: 360px; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #14141a; color: inherit; }
  button { background: #e8a33d; color: #111; border: 0; cursor: pointer; font-weight: 600; }
  #error { color: #ff6b6b; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f">
  <h1>Conectar con tu servidor</h1>
  <input id="url" placeholder="http://192.168.1.10:8730" autofocus>
  <button>Conectar</button>
  <div id="error"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await window.mediawatchConectar.guardar(document.getElementById('url').value.trim());
    if (!r.ok) document.getElementById('error').textContent = r.error;
  });
</script>
</body>
</html>
